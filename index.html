<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Retro Neon Racing - Deluxe</title>
<style>
    body {
        margin: 0;
        background: #0b0f19;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        touch-action: none;
    }
    canvas {
        background: #2b2b2b;
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        border-radius: 8px;
    }
    .controls {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        width: 100%;
        max-width: 400px;
        justify-content: center;
    }
    .btn {
        flex: 1;
        padding: 18px 0;
        font-size: 20px;
        font-weight: bold;
        background: rgba(0, 243, 255, 0.1);
        border: 2px solid #00f3ff;
        color: #00f3ff;
        border-radius: 12px;
        text-align: center;
        user-select: none;
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .btn:active {
        background: #00f3ff;
        color: #0b0f19;
    }
</style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="500"></canvas>
    
    <div class="controls">
        <div class="btn" id="leftBtn">◀ TRÁI</div>
        <div class="btn" id="rightBtn">PHẢI ▶</div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let car = { x: 160, y: 400, width: 42, height: 75, speed: 5, color: "#00f3ff", accent: "#ff0055" };
    let obstacles = [];
    let particles = [];
    let score = 0;
    let isGameOver = false;

    let moveLeft = false;
    let moveRight = false;
    let gameTime = 0; 

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    leftBtn.addEventListener("touchstart", () => { moveLeft = true; });
    leftBtn.addEventListener("touchend", () => { moveLeft = false; });
    rightBtn.addEventListener("touchstart", () => { moveRight = true; });
    rightBtn.addEventListener("touchend", () => { moveRight = false; });

    leftBtn.addEventListener("mousedown", () => { moveLeft = true; });
    leftBtn.addEventListener("mouseup", () => { moveLeft = false; });
    rightBtn.addEventListener("mousedown", () => { moveRight = true; });
    rightBtn.addEventListener("mouseup", () => { moveRight = false; });

    function spawnObstacle() {
        let lanes = [45, 130, 215, 295];
        let x = lanes[Math.floor(Math.random() * lanes.length)];
        let colors = [
            { body: "#ff0055", roof: "#ffffff" },
            { body: "#7000ff", roof: "#00f3ff" },
            { body: "#ffaa00", roof: "#ff0055" },
            { body: "#00ff66", roof: "#111827" }
        ];
        let chosenColor = colors[Math.floor(Math.random() * colors.length)];
        obstacles.push({ x: x, y: -90, width: 42, height: 75, speed: 4, color: chosenColor.body, roof: chosenColor.roof });
    }

    function createExplosion(x, y) {
        for (let i = 0; i < 40; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 6 + 1;
            particles.push({
                x: x + 21,
                y: y + 37,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 4 + 2,
                color: Math.random() > 0.5 ? "#ff0055" : "#ffaa00",
                alpha: 1
            });
        }
    }

    function drawDetailedCar(x, y, bodyColor, roofColor) {
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = bodyColor;
        ctx.shadowBlur = 10;
        ctx.shadowColor = bodyColor;
        ctx.fillRect(4, 10, 34, 55);

        ctx.fillStyle = roofColor;
        ctx.fillRect(8, 22, 26, 30);

        ctx.fillStyle = "#111827";
        ctx.fillRect(10, 18, 22, 6);
        ctx.fillRect(10, 54, 22, 6);

        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
        ctx.fillRect(6, 4, 8, 4);
        ctx.fillRect(28, 4, 8, 4);

        ctx.fillStyle = "#ff0000";
        ctx.shadowColor = "#ff0000";
        ctx.fillRect(6, 67, 8, 3);
        ctx.fillRect(28, 67, 8, 3);

        ctx.fillStyle = "#000";
        ctx.fillRect(-2, 12, 6, 14);
        ctx.fillRect(38, 12, 6, 14);
        ctx.fillRect(-2, 48, 6, 14);
        ctx.fillRect(38, 48, 6, 14);

        ctx.restore();
    }

    function update() {
        gameTime += 0.016;

        if (isGameOver) {
            for (let p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
            }
            return;
        }

        if (moveLeft && car.x > 20) car.x -= car.speed;
        if (moveRight && car.x < canvas.width - 62) car.x += car.speed;

        // Đã giảm tần số xuất hiện xe để game thoáng hơn, dễ né hơn
        if (Math.random() < 0.012) {
            spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].y += obstacles[i].speed;

            if (
                car.x < obstacles[i].x + obstacles[i].width &&
                car.x + car.width > obstacles[i].x &&
                car.y < obstacles[i].y + obstacles[i].height &&
                car.y + car.height > obstacles[i].y
            ) {
                isGameOver = true;
                createExplosion(car.x, car.y);
            }

            if (obstacles[i].y > canvas.height) {
                obstacles.splice(i, 1);
                score += 10;
            }
        }
    }

    function draw() {
        let cycle = (gameTime % 300) / 300;
        let phaseText = "SÁNG";

        if (cycle < 0.25) phaseText = "BUỔI SÁNG";
        else if (cycle < 0.5) phaseText = "BUỔI TRƯA";
        else if (cycle < 0.75) phaseText = "CHIỀU TÀ";
        else phaseText = "BAN ĐÊM";

        ctx.fillStyle = "#363636";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, 15, canvas.height);
        ctx.fillRect(canvas.width - 15, 0, 15, canvas.height);

        ctx.strokeStyle = "#ffcc00";
        ctx.lineWidth = 4;
        ctx.setLineDash([25, 25]);
        ctx.beginPath();
        ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
        ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        for (let obs of obstacles) {
            drawDetailedCar(obs.x, obs.y, obs.color, obs.roof);
        }

        if (!isGameOver) {
            drawDetailedCar(car.x, car.y, car.color, car.accent);
        }

        if (isGameOver) {
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        ctx.shadowBlur = 0;

        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(10, 10, 160, 50);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("Điểm: " + score, 20, 30);

        ctx.fillStyle = "#00f3ff";
        ctx.font = "12px sans-serif";
        ctx.fillText("Trời: " + phaseText, 20, 50);

        if (isGameOver) {
            ctx.fillStyle = "rgba(11, 15, 25, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("BÙM! TÔNG XE RỒI", canvas.width / 2, canvas.height / 2 - 45);

            ctx.fillStyle = "#fff";
            ctx.font = "18px sans-serif";
            ctx.fillText("Tổng điểm đạt được: " + score, canvas.width / 2, canvas.height / 2 - 5);

            ctx.fillStyle = "#00f3ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f3ff";
            ctx.fillRect(canvas.width / 2 - 80, canvas.height / 2 + 30, 160, 45);
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = "#0b0f19";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText("CHƠI LẠI", canvas.width / 2, canvas.height / 2 + 58);
            ctx.textAlign = "left";
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener("click", function(event) {
        if (isGameOver) {
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            if (
                clickX >= canvas.width / 2 - 80 &&
                clickX <= canvas.width / 2 + 80 &&
                clickY >= canvas.height / 2 + 30 &&
                clickY <= canvas.height / 2 + 75
            ) {
                car.x = 160;
                obstacles = [];
                particles = [];
                score = 0;
                isGameOver = false;
                gameTime = 0;
            }
        }
    });

    loop();
</script>

</body>
  </html>
